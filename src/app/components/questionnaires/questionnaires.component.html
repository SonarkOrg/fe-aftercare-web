<app-header></app-header>
<main class="page">
  <h2>Forms</h2>
  <div class="error-message" *ngIf="errorMessage">{{ errorMessage }}</div>
  <p *ngIf="loading">Loading…</p>
  <div class="table-wrap" *ngIf="definitions.length > 0">
  <table>
    <thead><tr><th>Title</th><th>Purpose</th><th>Specialty / appointment types</th><th>Version</th><th>Status</th><th>URL</th></tr></thead>
    <tbody>
      <tr *ngFor="let d of definitions">
        <td><a [routerLink]="['/questionnaires', d.id]">{{ d.title.en }}</a></td>
        <td>{{ humanize(d.purpose) }}</td>
        <td>{{ scope(d) }}</td>
        <td>{{ d.version }}</td>
        <td>{{ d.status }}</td>
        <td class="mono">{{ d.url }}</td>
      </tr>
    </tbody>
  </table>
  </div>
  <p *ngIf="!loading && !errorMessage && definitions.length === 0">No forms.</p>
</main>
