<section class="fd-walkin card" role="group" aria-labelledby="fd-walkin-title" fdScanGuard>
  <h2 class="card__title--sm" id="fd-walkin-title">{{ 'fd.walkIn.title' | t:{ name: name } }}</h2>
  <div class="fd-walkin__fields">
    <div class="form-group">
      <label for="fd-wi-type">{{ 'fd.walkIn.type' | t }}</label>
      <select id="fd-wi-type" fdScanGuard [ngModel]="choice.type" (ngModelChange)="setType($event)" name="wtype">
        <option *ngFor="let t of types" [value]="t">{{ t | enumLabel:'appointmentType' }}</option>
      </select>
    </div>
    <div class="form-group">
      <label for="fd-wi-spec">{{ 'fd.walkIn.specialty' | t }}</label>
      <select id="fd-wi-spec" fdScanGuard [ngModel]="choice.specialty" (ngModelChange)="setSpecialty($event)" name="wspec">
        <option *ngFor="let s of specialties" [value]="s">{{ s | enumLabel:'specialty' }}</option>
      </select>
    </div>
  </div>
  <p class="fd-panel__note fd-walkin__noq" *ngIf="!hasQuestionnaire">{{ 'fd.walkIn.noQuestionnaire' | t }}</p>
  <div class="btn-row">
    <button type="button" class="btn btn--primary fd-walkin-create" [disabled]="busy" (click)="create.emit()">{{ 'fd.walkIn.create' | t }}</button>
    <button type="button" class="btn btn--ghost fd-walkin-cancel" (click)="cancelled.emit()">{{ 'fd.walkIn.cancel' | t }}</button>
  </div>
</section>
