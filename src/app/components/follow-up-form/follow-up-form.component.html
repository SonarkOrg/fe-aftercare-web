<form class="follow-up-form" (ngSubmit)="submit()">
  <div class="form-group">
    <label for="fu-specialty">Specialty</label>
    <select id="fu-specialty" name="specialty" [(ngModel)]="specialty">
      <option value="VISCERAL_SURGERY">Visceral surgery</option>
      <option value="ORTHOPEDIC_SURGERY">Orthopedic surgery</option>
    </select>
    <span class="field-error" *ngIf="fieldErrors['specialty']">{{ fieldErrors['specialty'] }}</span>
  </div>
  <div class="form-group">
    <label for="fu-discharge">Discharge date</label>
    <input id="fu-discharge" type="date" name="dischargeDate" [(ngModel)]="dischargeDate" [max]="today" required>
    <span class="field-error" *ngIf="fieldErrors['dischargeDate']">{{ fieldErrors['dischargeDate'] }}</span>
  </div>
  <div class="form-group">
    <label for="fu-duration">Duration (days)</label>
    <input id="fu-duration" type="number" name="durationDays" [(ngModel)]="durationDays" min="1" max="30" required>
    <span class="field-error" *ngIf="fieldErrors['durationDays']">{{ fieldErrors['durationDays'] }}</span>
  </div>
  <div class="error-message" *ngIf="error">{{ error }}</div>
  <button type="submit" [disabled]="saving || !dischargeDate || !durationDays">Enroll in follow-up</button>
</form>
