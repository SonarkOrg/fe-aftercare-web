<div class="page page--narrow">
  <a class="back-link" routerLink="/appointments"><app-icon name="chevron-left" [size]="16" [stroke]="2"></app-icon>{{ 'shell.nav.appointments' | t }}</a>
  <section class="hero">
    <div><h1 class="hero__title">{{ (editId === null ? 'page.newAppointment' : 'page.editAppointment') | t }}</h1></div>
  </section>
  <section *ngIf="created as c" class="card created">
    <p>{{ 'apptForm.created' | t }}</p>
    <app-access-link [code]="c.accessCode"></app-access-link>
    <div class="btn-row"><a class="btn btn--primary" id="go-to-appointment" [routerLink]="['/appointments', c.appointment.id]">{{ 'apptForm.goTo' | t }}</a></div>
  </section>

  <div class="banner banner--error error-message" id="load-error" *ngIf="!loaded && error"><span class="banner__glyph" aria-hidden="true">▲</span><span><strong>{{ 'common.errorLabel' | t }}</strong> {{ error }}</span></div>

  <form *ngIf="!created && loaded" class="card" (ngSubmit)="submit()">
    <div class="grid-form form-2col">
      <div class="form-group span-2">
        <label for="ap-patient">{{ 'common.patient' | t }}</label>
        <select id="ap-patient" name="patientId" [(ngModel)]="patientId" [disabled]="editId !== null" required>
          <option [ngValue]="null" disabled>{{ 'apptForm.selectPatient' | t }}</option>
          <option *ngFor="let p of patients" [ngValue]="p.id">{{ p.firstName }} {{ p.lastName }}</option>
        </select>
      </div>
      <div class="form-group">
        <label for="ap-type">{{ 'appt.type' | t }}</label>
        <select id="ap-type" name="type" [(ngModel)]="type">
          <option *ngFor="let t of types" [value]="t">{{ t | enumLabel:'appointmentType' }}</option>
        </select>
      </div>
      <div class="form-group">
        <label for="ap-specialty">{{ 'appt.specialty' | t }}</label>
        <select id="ap-specialty" name="specialty" [(ngModel)]="specialty">
          <option *ngFor="let s of specialties" [value]="s">{{ s | enumLabel:'specialty' }}</option>
        </select>
      </div>
      <div class="form-group">
        <label for="ap-date">{{ 'chart.table.date' | t }}</label>
        <input id="ap-date" type="date" name="date" [(ngModel)]="date" required>
      </div>
      <div class="form-group">
        <label for="ap-time">{{ 'appt.time' | t }}</label>
        <input id="ap-time" type="time" step="300" name="time" [(ngModel)]="time" required>
      </div>
      <div class="form-group">
        <label for="ap-duration">{{ 'apptForm.duration' | t }}</label>
        <input id="ap-duration" type="number" min="5" max="480" name="durationMinutes" [(ngModel)]="durationMinutes" required>
      </div>
      <div class="form-group">
        <label for="ap-location">{{ 'appt.location' | t }}</label>
        <input id="ap-location" type="text" maxlength="255" name="location" [(ngModel)]="location">
      </div>
      <div class="form-group span-2">
        <label for="ap-clinician">{{ 'appt.clinician' | t }}</label>
        <input id="ap-clinician" type="text" maxlength="255" name="clinician" [(ngModel)]="clinician">
      </div>
    </div>
    <div class="banner banner--error error-message" *ngIf="error"><span class="banner__glyph" aria-hidden="true">▲</span><span><strong>{{ 'common.errorLabel' | t }}</strong> {{ error }}</span></div>
    <ul class="banner banner--error error-message" *ngIf="fieldErrorList.length"><li *ngFor="let e of fieldErrorList">▲ {{ e }}</li></ul>
    <div class="btn-row">
      <button type="submit" class="btn btn--primary" [disabled]="saving">{{ (editId === null ? 'apptForm.create' : 'apptForm.save') | t }}</button>
      <a class="btn btn--secondary" routerLink="/appointments">{{ 'common.cancel' | t }}</a>
    </div>
  </form>
</div>
