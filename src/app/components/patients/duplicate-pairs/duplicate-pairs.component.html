<section class="card card--list dup-pairs" [attr.aria-label]="'patients.duplicates.filter' | t">
  <div *ngIf="loading" aria-busy="true"><span class="sr-only">{{ 'common.loading' | t }}</span><div class="skeleton skeleton--row" *ngFor="let i of [1, 2]"></div></div>
  <div class="banner banner--error error-message" *ngIf="failed"><span class="banner__glyph" aria-hidden="true">▲</span><span><strong>{{ 'common.errorLabel' | t }}</strong> {{ 'patients.duplicates.error' | t }}</span><button type="button" class="btn btn--secondary btn--sm" (click)="load()">{{ 'common.retry' | t }}</button></div>
  <div class="empty" *ngIf="!loading && !failed && flags.length === 0"><span class="empty__glyph" aria-hidden="true">—</span><p class="empty__title">{{ 'patients.duplicates.empty' | t }}</p></div>
  <ul class="rows" *ngIf="!loading && !failed && flags.length > 0">
    <li *ngFor="let f of flags" class="dup-pair" role="group" [attr.aria-label]="'patients.duplicates.pairAria' | t:{ a: nameOf(f.a), b: nameOf(f.b) }">
      <div class="grid-2">
        <div *ngFor="let p of [f.a, f.b]">
          <a class="prow__name" [routerLink]="['/patients', p.id]">{{ nameOf(p) }}</a>
          <div class="row__sub">{{ bornText(p.dateOfBirth) }}</div>
          <a class="btn btn--secondary btn--sm" [routerLink]="['/patients', p.id]" [attr.aria-label]="('dashboard.menu.open' | t) + ' ' + nameOf(p)">{{ 'dashboard.menu.open' | t }}</a>
        </div>
      </div>
      <div class="row__sub">{{ flaggedText(f) }}</div>
    </li>
  </ul>
</section>
