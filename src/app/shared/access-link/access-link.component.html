<div class="access-link">
  <div class="row">
    <input #linkInput type="text" readonly [value]="link" [attr.aria-label]="'accessLink.aria' | t">
    <button type="button" class="btn btn--secondary" (click)="copy(linkInput)"><app-icon name="copy" [size]="16"></app-icon>{{ 'accessLink.copy' | t }}</button>
    <span *ngIf="message" class="copy-message" role="status">{{ message }}</span>
  </div>
  <p class="note">{{ 'accessLink.note' | t }}</p>
</div>
