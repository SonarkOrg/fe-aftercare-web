<ng-container *ngIf="kind === 'full'; else small">
  <figure class="trend">
    <figcaption class="trend__caption">
      <h3 class="trend__title">{{ labelText }}</h3>
      <span class="trend__legend">
        {{ 'chart.legend.base' | t }}
        <ng-container [ngSwitch]="true">
          <ng-container *ngSwitchCase="model.hasThreshold"> · {{ 'chart.legend.threshold' | t:{ threshold: thresholdText } }}</ng-container>
          <ng-container *ngSwitchCase="thresholdState === 'loading'"> · {{ 'chart.legend.loading' | t }}</ng-container>
          <ng-container *ngSwitchCase="thresholdState === 'failed'"> · {{ 'chart.legend.failed' | t }}</ng-container>
          <ng-container *ngSwitchDefault> · {{ 'chart.legend.none' | t }}</ng-container>
        </ng-container>
      </span>
    </figcaption>
    <div class="trend__plot">
      <svg class="bc" role="img" [attr.viewBox]="'0 0 ' + model.w + ' ' + model.h" [attr.aria-labelledby]="titleId + ' ' + descId" (keydown.escape)="hide()">
        <title [attr.id]="titleId">{{ model.title }}</title>
        <desc [attr.id]="descId">{{ model.desc }}</desc>
        <ng-container *ngTemplateOutlet="defs"></ng-container>
        <g aria-hidden="true">
          <text *ngFor="let t of model.yTicks" class="bc-axis" [attr.x]="model.pad.l - 14" [attr.y]="t.y + 4" text-anchor="end">{{ t.label }}</text>
          <text *ngFor="let l of model.labels" class="bc-day" [class.bc-day--today]="l.today" [class.bc-day--future]="l.future" [attr.x]="l.x" [attr.y]="l.y" text-anchor="middle">{{ l.text }}</text>
        </g>
        <line *ngIf="model.limit as l" class="bc-limit" [attr.x1]="l.x1" [attr.x2]="l.x2" [attr.y1]="l.y" [attr.y2]="l.y"/>
        <g *ngFor="let d of model.days" class="bar" tabindex="0" role="img" [attr.aria-label]="d.aria"
           (pointerenter)="show(d)" (pointerleave)="hide()" (focus)="show(d)" (blur)="hide()">
          <rect class="bar__focus" [attr.x]="d.focus.x" [attr.y]="d.focus.y" [attr.width]="d.focus.w" [attr.height]="d.focus.h" rx="14"/>
          <rect class="bar__hit" [attr.x]="d.band.x" [attr.y]="0" [attr.width]="d.band.w" [attr.height]="model.baseline"/>
          <ng-container *ngTemplateOutlet="barParts; context: { $implicit: d }"></ng-container>
          <title *ngIf="d.title">{{ d.title }}</title>
        </g>
        <g *ngIf="model.limit as l" aria-hidden="true">
          <rect class="bc-limit-pill" [attr.x]="l.pill.x" [attr.y]="l.pill.y" [attr.width]="l.pill.w" [attr.height]="l.pill.h" [attr.rx]="l.pill.rx"/>
          <text class="bc-limit-t" [style.font-size.px]="l.pill.fs" [attr.x]="l.pill.x + l.pill.w / 2" [attr.y]="l.pill.ty" text-anchor="middle">{{ l.pill.text }}</text>
        </g>
      </svg>
      <div class="chart-tip" *ngIf="active as a" role="status" [style.left.px]="tipLeft" [style.top.px]="a.tip.y">
        <div>{{ 'chart.tip.day' | t:{ day: a.day } }}<ng-container *ngIf="a.date"> · {{ a.date | tzDate:'dayShort' }}</ng-container></div>
        <div *ngIf="a.value !== null; else none"><strong>{{ a.value }}</strong>{{ unit }}</div>
        <ng-template #none><div>{{ 'chart.status.missed' | t }}</div></ng-template>
        <div *ngIf="a.alert">▲ {{ 'chart.tip.alert' | t }}</div>
      </div>
    </div>
    <table class="sr-only">
      <caption>{{ model.title }}</caption>
      <thead><tr><th scope="col">{{ 'chart.table.day' | t }}</th><th scope="col">{{ 'chart.table.date' | t }}</th><th scope="col">{{ 'chart.table.value' | t }}</th><th scope="col">{{ 'chart.table.status' | t }}</th></tr></thead>
      <tbody>
        <tr *ngFor="let r of model.rows"><td>{{ r.day }}</td><td>{{ r.date }}</td><td>{{ r.value }}</td><td>{{ r.status }}</td></tr>
      </tbody>
    </table>
  </figure>
</ng-container>

<ng-template #small>
  <svg class="bc" role="img" [attr.viewBox]="'0 0 ' + model.w + ' ' + model.h" [attr.aria-label]="model.summary"
       [attr.width]="kind === 'micro' ? model.w : null" [attr.height]="kind === 'micro' ? model.h : null">
    <ng-container *ngTemplateOutlet="defs"></ng-container>
    <line *ngIf="model.limit as l" class="bc-limit" [attr.x1]="l.x1" [attr.x2]="l.x2" [attr.y1]="l.y" [attr.y2]="l.y"/>
    <ng-container *ngFor="let d of model.days"><ng-container *ngTemplateOutlet="barParts; context: { $implicit: d }"></ng-container></ng-container>
    <g *ngIf="model.limit as l" aria-hidden="true">
      <rect class="bc-limit-pill" [attr.x]="l.pill.x" [attr.y]="l.pill.y" [attr.width]="l.pill.w" [attr.height]="l.pill.h" [attr.rx]="l.pill.rx"/>
      <text class="bc-limit-t" [style.font-size.px]="l.pill.fs" [attr.x]="l.pill.x + l.pill.w / 2" [attr.y]="l.pill.ty" text-anchor="middle">{{ l.pill.text }}</text>
    </g>
  </svg>
</ng-template>

<ng-template #defs>
  <svg:defs>
    <pattern [attr.id]="hatchId" width="20" height="20" patternUnits="userSpaceOnUse" patternTransform="rotate(30)"><rect width="20" height="20" fill="#f6f8f1"/><rect width="10" height="20" fill="#eef2e6"/></pattern>
    <pattern [attr.id]="greyId" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(30)"><rect width="8" height="8" fill="#f1f1f1"/><rect width="4" height="8" fill="#e5e7e2"/></pattern>
    <linearGradient [attr.id]="critId" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#f4cfc6"/><stop offset="1" stop-color="#fae2dc"/></linearGradient>
  </svg:defs>
</ng-template>

<ng-template #barParts let-d>
  <svg:rect class="bc-bar" [class.bc-bar--alert]="d.alert" [class.bc-bar--miss]="d.kind === 'missed'"
        [attr.x]="d.bar.x" [attr.y]="d.bar.y" [attr.width]="d.bar.w" [attr.height]="d.bar.h" [attr.rx]="d.bar.rx"
        [attr.fill]="'url(#' + (d.kind === 'missed' ? greyId : d.alert ? critId : hatchId) + ')'"/>
  <ng-container *ngIf="d.pill as p">
    <svg:rect class="bc-pill" [class.bc-pill--alert]="p.alert" [class.bc-pill--dash]="p.dash" [attr.x]="p.x" [attr.y]="p.y" [attr.width]="p.w" [attr.height]="p.h" [attr.rx]="p.rx"/>
    <svg:text class="bc-pill-t" [class.bc-pill-t--alert]="p.alert" [class.bc-pill-t--dash]="p.dash" [style.font-size.px]="p.fs" [attr.x]="p.x + p.w / 2" [attr.y]="p.ty" text-anchor="middle">{{ p.text }}<tspan *ngIf="p.unit" class="bc-unit" dx="3">{{ p.unit }}</tspan></svg:text>
  </ng-container>
</ng-template>
