<div class="page">
  <section class="card empty forbidden">
    <span class="empty__glyph" aria-hidden="true"><app-icon name="lock" [size]="22"></app-icon></span>
    <h1 class="empty__title">{{ 'auth.forbidden.title' | t }}</h1>
    <p class="empty__text">{{ 'auth.forbidden.text' | t:{ role: roleLabel } }}</p>
    <a class="btn btn--secondary" routerLink="/dashboard">{{ 'auth.forbidden.back' | t }}</a>
  </section>
</div>
